<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1260" viewBox="0 0 1160 1260" role="img" aria-labelledby="title desc"><title id="title">首版九层验证路径与发布准入</title><desc id="desc">规范与资源冻结后，领域、协议和视觉分支并行。基础设施和应用编排完成后进入正式包，再并行验证四游戏与质量分发。全部必需组合通过后评审B5。当前128个用例定义153个执行组合均未执行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#969bab"/></marker></defs><rect width="1160" height="1260" rx="20" fill="#1a1e29"/><g fill="none" stroke="#969bab" stroke-width="1.8" marker-end="url(#arrow)"><path d="M580 128V165H210V204"/><path d="M580 128V204"/><path d="M580 165H950V204"/><path d="M210 310V384"/><path d="M380 260H390V600H394"/><path d="M580 310V544"/><path d="M380 440H390V600H394"/><path d="M580 650V704"/><path d="M950 310V760H766"/><path d="M580 810V850H250V884"/><path d="M580 850H910V884"/><path d="M250 990V1030H580V1074"/><path d="M910 990V1030H580V1074"/></g><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif"><rect x="400" y="28" width="360" height="100" rx="12" fill="#333843" stroke="#9da4b32b"/><text x="418" y="57" fill="#eaebf0" font-size="16" font-weight="550">L0 · 规范、资源与工程前置</text><text x="418" y="83" fill="#bdc1cd" font-size="13">范围 / 契约 / 许可 / 质量政策</text><text x="418" y="107" fill="#969bab" font-size="12">批准与工程检查分开记录</text></g><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif"><rect x="40" y="210" width="340" height="100" rx="12" fill="#333843" stroke="#9da4b32b"/><text x="58" y="239" fill="#eaebf0" font-size="16" font-weight="550">L1 · 领域规则与状态机</text><text x="58" y="265" fill="#bdc1cd" font-size="13">身份 / 阅读分段 / 配置三态</text><text x="58" y="289" fill="#969bab" font-size="12">受控端口只证明规则</text></g><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif"><rect x="410" y="210" width="340" height="100" rx="12" fill="#333843" stroke="#9da4b32b"/><text x="428" y="239" fill="#eaebf0" font-size="16" font-weight="550">L2 · ABI 与跨进程契约</text><text x="428" y="265" fill="#bdc1cd" font-size="13">新 Core 七回调 / PE32 + PE64</text><text x="428" y="289" fill="#969bab" font-size="12">实际 Rust 双架构 / DTO / worker</text></g><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif"><rect x="780" y="210" width="340" height="100" rx="12" fill="#333843" stroke="#9da4b32b"/><text x="798" y="239" fill="#eaebf0" font-size="16" font-weight="550">L5 · 组件、视觉与可访问交互</text><text x="798" y="265" fill="#bdc1cd" font-size="13">实际组件 / 批准稿 / 截图差异</text><text x="798" y="289" fill="#969bab" font-size="12">冻结 DTO 后可并行</text></g><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif"><rect x="40" y="390" width="340" height="100" rx="12" fill="#333843" stroke="#9da4b32b"/><text x="58" y="419" fill="#eaebf0" font-size="16" font-weight="550">L3 · 真实基础设施集成</text><text x="58" y="445" fill="#bdc1cd" font-size="13">SQLite / Keychain / HTTP / 语言</text><text x="58" y="469" fill="#969bab" font-size="12">提交、取消、故障与恢复</text></g><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif"><rect x="400" y="550" width="360" height="100" rx="12" fill="#333843" stroke="#9da4b32b"/><text x="418" y="579" fill="#eaebf0" font-size="16" font-weight="550">L4 · 应用编排</text><text x="418" y="605" fill="#bdc1cd" font-size="13">关联即接入 / snapshot 与 revision</text><text x="418" y="629" fill="#969bab" font-size="12">真实端口 + 可重放故障时序</text></g><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif"><rect x="400" y="710" width="360" height="100" rx="12" fill="#333843" stroke="#9da4b32b"/><text x="418" y="739" fill="#eaebf0" font-size="16" font-weight="550">L6 · 正式包与原生旅程</text><text x="418" y="765" fill="#bdc1cd" font-size="13">同一最终 RC / 实际安装 bundle</text><text x="418" y="789" fill="#969bab" font-size="12">真实服务 / 离线词典 / 多窗系统</text></g><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif"><rect x="80" y="890" width="340" height="100" rx="12" fill="#333843" stroke="#9da4b32b"/><text x="98" y="919" fill="#eaebf0" font-size="16" font-weight="550">L7 · 四游戏端到端</text><text x="98" y="945" fill="#bdc1cd" font-size="13">SR / MO / Never7 / サクラノ詩</text><text x="98" y="969" fill="#969bab" font-size="12">逐款配对字幕与连续样本</text></g><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif"><rect x="740" y="890" width="340" height="100" rx="12" fill="#333843" stroke="#9da4b32b"/><text x="758" y="919" fill="#eaebf0" font-size="16" font-weight="550">L8 · 质量、稳定性与分发</text><text x="758" y="945" fill="#bdc1cd" font-size="13">性能 / 语言质量 / 隐私 / 安装恢复</text><text x="758" y="969" fill="#969bab" font-size="12">预定政策 / 干净环境 / 人工审阅</text></g><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif"><rect x="290" y="1080" width="580" height="100" rx="12" fill="#333843" stroke="#9da4b32b"/><text x="308" y="1109" fill="#eaebf0" font-size="16" font-weight="550">B5 · 完整首版发布评审</text><text x="308" y="1135" fill="#bdc1cd" font-size="13">全部必需组合 passed + 设计与政策批准 + 无阻断缺陷</text><text x="308" y="1159" fill="#969bab" font-size="12">当前全部 NOT_RUN；此图不是执行结果</text></g><text x="580" y="1224" text-anchor="middle" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" fill="#969bab">依赖按垂直切片生效；各层不能互相冒充。最终正式包测试必须使用同一 RC。</text></svg>
