frame" title="独立设计稿预览" src="history.html?scenario=history" width="1040" height="720"></iframe></div></div><section class="review-boundary"><strong>本次核对范围</strong><p>同尺寸比较原稿与修订。历史的两条分页、设置独立保存、旧句查词与精读继续保留；有效窗口预览与游戏取文分别表达。原稿对照保留冻结历史字节，不作为新产品行为。设计按钮使用原离线演示，未接入本机游戏、数据库或翻译服务。</p><p>原61份源、C1尺寸、C35、批准图及材质token保持原样。本次候选和截图需要单独评审，不代表整版产品通过。</p></section></main><script src="review.js"></script></body></html>
