<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Luna · 通用设置缺口补充 · 待用户确认</title><link rel="stylesheet" href="assets/material-tokens.css"><link rel="stylesheet" href="source/settings.css"><link rel="stylesheet" href="state-gap.css"></head>
<body><section class="window" aria-label="Luna 设置设计候选"><header class="titlebar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><strong>设置</strong></header><div class="layout"><aside class="sidebar"><button class="back quiet" data-action="main"><span data-luna-icon="arrow-left"></span>返回主界面</button><label class="search"><span data-luna-icon="search"></span><input type="search" aria-label="搜索设置" placeholder="搜索设置"></label><nav aria-label="设置分类"><button class="nav-item selected" aria-current="page" data-page="general"><span data-luna-icon="settings"></span>通用</button><button class="nav-item" data-page="input"><span data-luna-icon="plug"></span>输入与HOOK</button><button class="nav-item" data-page="ocr"><span data-luna-icon="scan"></span>OCR引擎</button><button class="nav-item" data-page="translation"><span data-luna-icon="languages"></span>翻译服务</button><button class="nav-item" data-page="text"><span data-luna-icon="sliders"></span>文本处理</button><button class="nav-item" data-page="speech"><span data-luna-icon="volume"></span>语音</button><button class="nav-item" data-page="display"><span data-luna-icon="type"></span>显示与快捷键</button><button class="nav-item" data-page="network"><span data-luna-icon="globe"></span>网络服务</button><button class="nav-item" data-page="data"><span data-luna-icon="database"></span>配置与数据</button><button class="nav-item" data-page="diagnostics"><span data-luna-icon="activity"></span>更新与诊断</button></nav><div class="sidebar-foot">个人配置 · 默认<br><span>全局与游戏覆盖</span></div></aside>
<main class="main"><div class="content" tabindex="-1"><header class="heading"><div class="heading-text"><h1>通用</h1><p>阅读显示与本机偏好。</p></div>
<div class="scope-bar"><span>阅读偏好</span><div class="scope-select"><button id="scope-button" class="select-button" aria-haspopup="listbox" aria-expanded="false" aria-controls="scope-options"><span id="scope-value">全局默认</span><span data-luna-icon="chevron-down"></span></button><div id="scope-options" class="options" role="listbox" aria-label="阅读偏好作用范围" hidden><button type="button" role="option" aria-selected="true" data-scope="global">全局默认</button><button type="button" role="option" aria-selected="false" data-scope="game">仅此游戏 · サクラノ詩</button></div></div><small id="scope-help">作为游戏的默认阅读偏好</small><div id="game-source" class="game-source" hidden><span id="current-source">当前来源：继承全局</span><button id="restore-inheritance" class="inline-link" disabled>恢复继承全局</button><small id="inheritance-draft" hidden></small><details id="saved-overrides" hidden><summary>查看已保存的覆盖项</summary><span id="saved-overrides-list"></span></details></div></div></header>
<section class="group" aria-labelledby="lexical-title"><h2 id="lexical-title">分词与词典</h2><div class="card lexical-card"><div class="row toggle-row"><div><label id="seg-label" for="seg-switch">可点击日语分词</label><p>点击原文中的词语，查看本地释义。</p></div><button id="seg-switch" type="button" class="switch" role="switch" aria-labelledby="seg-label" aria-checked="true" data-field="segmentation"><span></span></button></div><div class="row toggle-row"><div><label id="ruby-label" for="ruby-switch">显示日语注音</label><p>可独立开启；复制原文时不包含注音。</p></div><button id="ruby-switch" type="button" class="switch" role="switch" aria-labelledby="ruby-label" aria-checked="true" data-field="ruby"><span></span></button></div><div class="row toggle-row"><div><label id="pos-label" for="pos-switch">显示词性标记</label><p id="pos-description">在可点击分词开启时显示。</p></div><button id="pos-switch" type="button" class="switch" role="switch" aria-labelledby="pos-label" aria-describedby="pos-description" aria-checked="false" data-field="pos"><span></span></button></div><div class="row dictionary"><div><span>基础词典</span><p>随客户端内置，无需配置或下载。</p></div><span class="plain-status">已内置</span></div></div></section>
<section class="group" aria-labelledby="records-title"><h2 id="records-title">阅读记录</h2><div class="card"><div class="row utility-row"><div><span>始终保存原文、译文与来源</span><p>按游戏与会话回看已保存内容。</p></div><button class="text-action" data-action="history">阅读历史<span data-luna-icon="external-link"></span></button></div></div><p class="section-note">暂停输入与自动翻译在<button class="inline-link" data-action="session">当前会话</button>中设置。</p></section>
<section class="group local-group" aria-labelledby="local-title"><h2 id="local-title">本机偏好</h2><div class="card"><div class="row toggle-row"><div><label id="login-label" for="login-switch">登录后打开 Luna</label><p>当前不可用<button class="inline-link" id="login-details-toggle" aria-expanded="false" aria-controls="login-details">查看原因</button></p></div><button id="login-switch" class="switch" type="button" role="switch" aria-labelledby="login-label" aria-checked="false" disabled><span></span></button></div><div id="login-details" class="detail" hidden><p>系统未找到此应用的登录服务。此状态不会影响取文、翻译或阅读偏好的保存。</p><div class="detail-actions"><button class="control" data-action="retry-login">重新读取状态</button><span id="login-result" role="status"></span></div></div></div></section>
</div><footer class="footer"><span id="save-status" role="status" aria-live="polite">阅读偏好已保存<span class="status-scope">全局默认</span></span><div class="footer-actions"><button id="discard" class="control" disabled>放弃修改</button><button id="save" class="control primary" disabled>保存阅读偏好</button></div></footer></main></div></section>
<dialog id="sample-dialog" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><button class="dialog-close quiet" aria-label="关闭对话框" data-action="close-dialog"><span data-luna-icon="x"></span></button></header><div id="dialog-body"></div><footer><button class="control" data-action="close-dialog">返回设置</button></footer></dialog><div class="toast" id="toast" hidden role="status"></div>
<script src="assets/icons.js"></script><script src="source/settings.js"></script><script src="state-gap.js"></script></body></html>
