name: Engineering gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base:
        description: Existing full base commit SHA
        required: true
        type: string
      head:
        description: Exact candidate commit SHA
        required: true
        type: string
      negative_probe:
        description: Administrator-only rejection experiment; never grants merge
        default: false
        type: boolean

permissions: {}

jobs:
  admission:
    name: Trusted candidate admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.candidate.outputs.head }}
      base: ${{ steps.candidate.outputs.base }}
      repository: ${{ steps.candidate.outputs.repository }}
      mode: ${{ steps.candidate.outputs.mode }}
    steps:
      # Protected-base workflow: never checks out or executes candidate code.
      - uses: actions/github-script@v7
        id: candidate
        env:
          REVIEW_HEAD: ${{ vars.GATE_REVIEW_HEAD_SHA }}
          REVIEW_URL: ${{ vars.GATE_REVIEW_BUNDLE_URL }}
          REVIEW_HASH: ${{ vars.GATE_REVIEW_BUNDLE_SHA256 }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const inputs = context.payload.inputs || {};
            const head = pr ? pr.head.sha : inputs.head;
            const base = pr ? pr.base.sha : inputs.base;
            const repository = pr ? pr.head.repo.full_name : context.repo.owner + '/' + context.repo.repo;
            const sha = /^[a-f0-9]{40}(?:[a-f0-9]{24})?$/;
            if (!sha.test(head || '') || !sha.test(base || '') || /^0+$/.test(base)) {
              throw new Error('Candidate and base must be real full commit identities');
            }
            core.setOutput('head', head);
            core.setOutput('base', base);
            core.setOutput('repository', repository);
            const probe = !pr && String(inputs.negative_probe) === 'true';
            if (probe) {
              const result = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username: context.actor});
              if (result.data.permission !== 'admin') throw new Error('Negative probe requires repository administrator');
              core.setOutput('mode', 'negative_probe');
            } else {
              if (process.env.REVIEW_HEAD !== head || !/^[a-f0-9]{64}$/.test(process.env.REVIEW_HASH || '') ||
                  !String(process.env.REVIEW_URL || '').startsWith('https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/releases/download/')) {
                throw new Error('Current exact candidate has no administrator-pinned independent review');
              }
              core.setOutput('mode', 'normal');
            }
            await github.rest.repos.getCommit({...context.repo, ref: base});

  engineering:
    name: Full engineering verification
    needs: admission
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GATE_REVIEW_BUNDLE_URL: ${{ vars.GATE_REVIEW_BUNDLE_URL }}
      GATE_REVIEW_BUNDLE_SHA256: ${{ vars.GATE_REVIEW_BUNDLE_SHA256 }}
    steps:
      # This isolated job has no write token or secrets. Checkout is immutable.
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.admission.outputs.repository }}
          ref: ${{ needs.admission.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: Toolchain and actual input identity
        run: |
          git rev-parse HEAD
          uname -m
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          rustup default 1.89.0
      - name: Locked compiler and browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/desktop --no-audit --no-fund
          node node_modules/playwright-core/cli.js install chromium
          cargo fetch --locked
      - name: Restore exact resource and real-observer inputs
        run: |
          python3 scripts/quality/github_ci.py resources
          python3 scripts/quality/github_ci.py compiler-resources
          python3 scripts/quality/github_ci.py evidence
          python3 scripts/quality/github_ci.py review
      - name: Execute production component, timing, migration and storage adapters
        run: python3 scripts/quality/github_ci.py produce
      - name: Specification, boundaries, full 32-case verification and compilation
        env:
          QUALITY_BASE_REF: ${{ needs.admission.outputs.base }}
        run: npm run verify -- --stage ci --base "$QUALITY_BASE_REF"
      - name: Keep actual receipts, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-gate-receipts-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .build/quality/github-activation-20261115/
            .build/quality/effective-gates/
            reports/gates/
          if-no-files-found: warn

  final-status:
    name: Publish trusted required status
    needs: [admission, engineering]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      # Fresh host: never executes candidate code or trusts its artifact label.
      - uses: actions/github-script@v7
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
          ENGINEERING_RESULT: ${{ needs.engineering.result }}
          ADMITTED_HEAD: ${{ needs.admission.outputs.head }}
          ADMISSION_MODE: ${{ needs.admission.outputs.mode }}
        with:
          script: |
            if (!context.payload.pull_request) {
              core.info('Manual experiments do not publish a merge-authorizing status');
              return;
            }
            const result = await github.rest.pulls.get({...context.repo, pull_number: context.payload.pull_request.number});
            const head = context.payload.pull_request.head.sha;
            const passed = process.env.ADMISSION_RESULT === 'success' && process.env.ENGINEERING_RESULT === 'success' &&
              process.env.ADMISSION_MODE === 'normal' && process.env.ADMITTED_HEAD === head && result.data.head.sha === head;
            const check = await github.rest.checks.create({...context.repo, head_sha: head,
              name: 'Luna / engineering', status: 'completed', conclusion: passed ? 'success' : 'failure',
              output: {title: passed ? 'Current engineering gates passed' : 'Candidate is not qualified',
                summary: passed ? 'Exact reviewed candidate passed all required engineering gates' : 'Admission or engineering verification is incomplete or failed'},
              details_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId});
            core.info(JSON.stringify({required_check_id: check.data.id, app_id: check.data.app.id, head_sha: head}));
