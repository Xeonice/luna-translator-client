[package]
name = "app-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
app-core = { path = "../app-core" }
hook-client = { path = "../hook-client" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "limits"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros", "net"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream", "form"] }
eventsource-stream = "=0.2.3"
futures-util = "=0.3.34"
uuid = { version = "=1.28.0", features = ["v4"] }
md5 = "=0.8.1"
ring = "=0.17.14"
base64 = "=0.22.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Security_Credentials", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
